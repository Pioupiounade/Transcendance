services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: pioupiounades-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - pioupiounades_network

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
     context: ../backend
     dockerfile: ../docker/backend/Dockerfile

    container_name: pioupiounades-backend

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SSL_KEY_PATH: /certs/key.pem
      SSL_CERT_PATH: /certs/cert.pem

    ports:
      - "3000:3000"

    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
      - ./certs:/certs:ro

    networks:
      - pioupiounades_network

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
     context: ../frontend
     dockerfile: ../docker/frontend/Dockerfile

    container_name: pioupiounades-frontend

    restart: unless-stopped

    environment:
      VITE_API_URL: /api
      VITE_DEV_PROXY_TARGET: https://backend:3000

    ports:
      - "5173:5173"

    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./certs:/app/certs:ro

    networks:
      - pioupiounades_network

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
networks:
  pioupiounades_network:
    driver: bridge