server {
# IPv4 port 443
	listen 443 ssl;
# IPv6 port 443
	listen [::]:443 ssl;

# domain name
	server_name mlelu.42.fr;

# root directory with the Wordpress files
	root /var/www/html;

# search for index.php then index.html
# index.php = entrypoint of the website
	index index.php index.html;

# path to SSL certificate fil which encrypts HTTPS communications
	ssl_certificate /etc/nginx/ssl/inception.crt;

# path to SSL private key used by TLS
	ssl_certificate_key /etc/nginx/ssl/inception.key;

# allow 1.2 and 1.3 only
	ssl_protocols TLSv1.2 TLSv1.3;

# behavior for requests sent to the website root
# try to serve the requested file, directory or redirect to index.php
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

# handle PHP files
	location ~ \.php$ {
# load default FastCGI configuration - communication protocol between PHP-FPM 
# and NGINX -> Send this request to the PHP server
		include snippets/fastcgi-php.conf;
# send PHP request to the WordPress container through port 9000
		fastcgi_pass wordpress:9000;
	}

# Deny access to Apach configuration files
	location ~ /\.ht {
# reject all request targeting .ht files
		deny all;
	}
}