  <circle cx="368" cy="242" r="8" fill="#FFBE5C"/>
  <circle cx="565" cy="255" r="14" fill="#66D18A" fill-opacity="0.18"/>
  <circle cx="565" cy="255" r="8" fill="#66D18A"/>
