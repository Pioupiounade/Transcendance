    <rect x="18" y="18" width="76" height="24" rx="12" fill="url(#pillRejected)"/>
    <text x="56" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">REJECTED</text>
