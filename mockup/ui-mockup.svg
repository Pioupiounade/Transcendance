    <text x="57" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">APPROVED</text>
    <circle cx="26" cy="72" r="7" fill="#63C27C"/>
    <text x="42" y="78" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">Point B</text>
    <text x="18" y="96" font-family="Inter, Arial, sans-serif" font-size="13" fill="#93A0B2">8 utilisateurs • Centre ville</text>
  </g>

