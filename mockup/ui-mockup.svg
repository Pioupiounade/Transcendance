    <path d="M1056 44C1056 29.6406 1067.64 18 1082 18H1318C1332.36 18 1344 29.6406 1344 44V690C1344 723.137 1317.14 750 1284 750H1082C1067.64 750 1056 738.359 1056 724V44Z" fill="none"/>
