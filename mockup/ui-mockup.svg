<svg width="1366" height="768" viewBox="0 0 1366 768" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1366" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0F14"/>
      <stop offset="1" stop-color="#11161D"/>
    </linearGradient>
    <linearGradient id="mapBg" x1="24" y1="16" x2="1056" y2="752" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141A22"/>
      <stop offset="1" stop-color="#0F141B"/>
    </linearGradient>
    <linearGradient id="sidebarBg" x1="1056" y1="16" x2="1342" y2="752" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171D25"/>
      <stop offset="1" stop-color="#10151C"/>
    </linearGradient>
    <linearGradient id="pillPending" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBE5C"/>
      <stop offset="1" stop-color="#E58B18"/>
    </linearGradient>
    <linearGradient id="pillApproved" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66D18A"/>
      <stop offset="1" stop-color="#2B9F59"/>
    </linearGradient>
    <linearGradient id="pillRejected" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F07A7A"/>
      <stop offset="1" stop-color="#D14E4E"/>
    </linearGradient>
    <linearGradient id="mapDot" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
