<svg width="1024" height="768" viewBox="0 0 1024 768" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1024" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0F14"/>
      <stop offset="1" stop-color="#11161D"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="48" y1="44" x2="992" y2="724" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111821"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#D7E0EB"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="768" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="0" y="0" width="1024" height="768" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1024" height="768" fill="url(#pageBg)"/>

  <g filter="url(#shadow)">
    <rect x="48" y="44" width="928" height="680" rx="34" fill="url(#panelBg)"/>
  </g>

  <!-- Header -->
  <circle cx="512" cy="130" r="74" fill="url(#accent)"/>
  <circle cx="512" cy="130" r="66" fill="#131922"/>
  <circle cx="512" cy="130" r="62" fill="#0F141B"/>
  <path d="M486 158C490 140 500 132 512 132C524 132 534 140 538 158" stroke="#F4F7FB" stroke-width="4" stroke-linecap="round"/>
  <circle cx="512" cy="121" r="18" fill="#F4F7FB"/>

  <text x="512" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="1.5" fill="#F4F7FB">USER</text>
  <text x="512" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#93A0B2">admin • membre depuis juillet 2026</text>

  <!-- Top action pills -->
  <g filter="url(#softShadow)">
    <rect x="266" y="300" width="124" height="42" rx="21" fill="#F4F7FB"/>
    <text x="328" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0D1117">Modifier</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="400" y="300" width="100" height="42" rx="21" fill="#10161E" fill-opacity="0.92" stroke="#2A3442"/>
    <text x="450" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F4F7FB">Stats</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="510" y="300" width="122" height="42" rx="21" fill="#10161E" fill-opacity="0.92" stroke="#2A3442"/>
    <text x="571" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F4F7FB">Historique</text>
  </g>

  <!-- Stats cards -->
  <g filter="url(#softShadow)">
    <rect x="72" y="372" width="180" height="104" rx="24" fill="#10161E" stroke="#2A3442"/>
    <text x="96" y="404" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#98A4B5">POINTS</text>
    <text x="96" y="448" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F7FB">120</text>
    <text x="96" y="468" font-family="Inter, Arial, sans-serif" font-size="12" fill="#93A0B2">+18 cette semaine</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="270" y="372" width="180" height="104" rx="24" fill="#10161E" stroke="#2A3442"/>
    <text x="294" y="404" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#98A4B5">POI VALIDÉS</text>
    <text x="294" y="448" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F7FB">16</text>
    <text x="294" y="468" font-family="Inter, Arial, sans-serif" font-size="12" fill="#93A0B2">4 en attente</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="468" y="372" width="180" height="104" rx="24" fill="#10161E" stroke="#2A3442"/>
    <text x="492" y="404" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#98A4B5">RÔLE</text>
    <text x="492" y="448" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F7FB">Admin</text>
    <text x="492" y="468" font-family="Inter, Arial, sans-serif" font-size="12" fill="#93A0B2">Validation des POI</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="666" y="372" width="286" height="104" rx="24" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="690" y="404" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#98A4B5">ACTIVITÉ RÉCENTE</text>
    <text x="690" y="438" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F4F7FB">3 validations aujourd’hui</text>
    <text x="690" y="466" font-family="Inter, Arial, sans-serif" font-size="12" fill="#93A0B2">Dernière action il y a 12 min</text>
  </g>

  <!-- Main content panel -->
  <g filter="url(#softShadow)">
    <rect x="72" y="500" width="880" height="180" rx="28" fill="#10161E" stroke="#2A3442"/>
  </g>

  <text x="96" y="536" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">Contenu du profil</text>
  <text x="96" y="560" font-family="Inter, Arial, sans-serif" font-size="13" fill="#98A4B5">Résumé des informations et des actions récentes</text>

  <!-- Content rows -->
  <g>
    <rect x="96" y="586" width="392" height="68" rx="18" fill="#0B0F14" stroke="#2A3442"/>
    <circle cx="126" cy="620" r="12" fill="#F4F7FB"/>
    <text x="152" y="613" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F4F7FB">Email</text>
    <text x="152" y="635" font-family="Inter, Arial, sans-serif" font-size="13" fill="#93A0B2">user@example.com</text>
  </g>

  <g>
    <rect x="512" y="586" width="416" height="68" rx="18" fill="#0B0F14" stroke="#2A3442"/>
    <circle cx="542" cy="620" r="12" fill="#74819B"/>
    <text x="568" y="613" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F4F7FB">Dernière connexion</text>
    <text x="568" y="635" font-family="Inter, Arial, sans-serif" font-size="13" fill="#93A0B2">Aujourd’hui à 09:42</text>
  </g>

  <!-- Decorative note badge -->
  <g filter="url(#softShadow)">
    <rect x="742" y="118" width="176" height="44" rx="22" fill="#10161E" fill-opacity="0.94" stroke="#2A3442"/>
    <text x="830" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F4F7FB">Profil vérifié</text>
  </g>
</svg>
